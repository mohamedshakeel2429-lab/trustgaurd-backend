services:
  - type: web
    name: scamchain-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_ANALYSIS_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_CHAT_MODEL
        value: qwen/qwen3.8-27b
      - key: SERPAPI_API_KEY
        sync: false
